async function ai(system,user,provider=defProv(),model){
  const k=cleanKey(S.keys[provider]);if(!k)throw new Error('API key yok. Ayarlar sekmesinden '+(PROV[provider]||{n:provider}).n+' anahtarını gir.');
  const v=PROV[provider],m=model||(S.models[provider]||'').split(',')[0].trim()||v.model;let r,d;
  if(v.t==='anthropic'){
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:1500,system,messages:[{role:'user',content:user}]})});
    d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(keyErr(r.status,d));return d.content.map(c=>c.text||'').join('');
  }
  if(v.t==='gemini'){
    return await gCall(k,m,system,[{text:user}]);
  }
  r=await fetch((S.bases[provider]||v.base)+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+k},body:JSON.stringify({model:m,messages:[{role:'system',content:system},{role:'user',content:user}]})});
  d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(keyErr(r.status,d));

}
const cleanKey=k=>String(k||'').replace(/^[\s"'`]+|[\s"'`]+$/g,'').replace(/^(Bearer|Authorization:)\s+/i,'').replace(/\s+/g,'');
const gHead=k=>({'content-type':'application/json','x-goog-api-key':k});
const gText=d=>{const c=d&&d.candidates&&d.candidates[0];const t=c&&c.content&&c.content.parts?c.content.parts.filter(x=>!x.thought).map(x=>x.text||'').join(''):'';if(!t){const why=(d&&d.promptFeedback&&d.promptFeedback.blockReason)||(c&&c.finishReason)||'bos cevap';throw new Error('Gemini cevap vermedi ('+why+')')}return t};
async function gCall(k,m,system,parts){const url=`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`;
let r=await fetch(url,{method:'POST',headers:gHead(k),body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts}]})});
let d=await r.json().catch(()=>({}));
const msg=(d&&d.error&&d.error.message)||'';
if(!r.ok&&/developer instruction|system instruction|systemInstruction/i.test(msg)){
  const p2=parts.map((x,i)=>i===parts.length-1&&x.text!==undefined?{text:system+'\n\n'+x.text}:x);
  r=await fetch(url,{method:'POST',headers:gHead(k),body:JSON.stringify({contents:[{role:'user',parts:p2}]})});
  d=await r.json().catch(()=>({}));
}
if(!r.ok)throw new Error(keyErr(r.status,d));return gText(d)}

function localParse(t){const s=t.toLowerCase(),d=new Date();

const m=s.match(/saat\s*(\d{1,2})(?:[:.](\d{2}))?/)||s.match(/(\d{1,2})[:.](\d{2})/);

const b64enc=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const decEnt=t=>t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,c)=>String.fromCharCode(+c)).replace(/&amp;/g,'&');
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Dosya bir Office belgesi gibi görünmüyor');
const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
files[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={meth,csz,off};p+=46+nl+xl+cl}
const get=async name=>{const f=files[name];if(!f)return null;const ln=dv.getUint16(f.off+26,true),lx=dv.getUint16(f.off+28,true),st=f.off+30+ln+lx,raw=u.subarray(st,st+f.csz);if(f.meth===0)return raw;
return new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())};
return{names:Object.keys(files),get}}
async function docxText(buf){const z=await unzip(buf),b=await z.get('word/document.xml');if(!b)throw new Error('Word dosyası okunamadı');

async function pptxText(buf){const z=await unzip(buf),dec=new TextDecoder();const sl=z.names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));let out='';
for(const nm of sl){const x=dec.decode(await z.get(nm));out+=decEnt([...x.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m=>m[1]).join(' '))+'\n\n'}return out}
async function xlsxText(buf){const z=await unzip(buf),dec=new TextDecoder();let ss=[];const sb=await z.get('xl/sharedStrings.xml');
if(sb)ss=[...dec.decode(sb).matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>decEnt([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join('')));
const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort().slice(0,4);let out='';
for(const nm of sheets){const x=dec.decode(await z.get(nm));out+='# '+nm.split('/').pop()+'\n';
for(const r of x.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)){const cells=[];
for(const c of r[1].matchAll(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){const at=c[1],body=c[2]||'',tm=at.match(/t="(\w+)"/),t=tm?tm[1]:'',vm=body.match(/<v>([\s\S]*?)<\/v>/);let v=vm?vm[1]:'';
if(t==='s')v=ss[+v]||'';else if(t==='inlineStr')v=decEnt([...body.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>x[1]).join(''));
else if(v!==''&&/s="\d+"/.test(at)&&+v>=43831&&+v<=54788)v=new Date(Date.UTC(1899,11,30)+(+v)*864e5).toISOString().slice(0,10);else v=decEnt(v);
if(v!=='')cells.push(v)}
if(cells.length)out+=cells.join(' | ')+'\n'}}

async function pdfText(buf){const L=await loadPdfJs(),doc=await L.getDocument({data:new Uint8Array(buf.slice(0))}).promise;let out='';
for(let i=1;i<=Math.min(doc.numPages,60);i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();out+=tc.items.map(x=>x.str).join(' ')+'\n\n'}return out}
async function readAnyFile(f){const n=f.name||'dosya',t=f.type||'',ext=(n.split('.').pop()||'').toLowerCase();
if(TXT_RE.test(n)||/^text\//.test(t)||/json/.test(t)){let x=await f.text();if(/\.html?$/i.test(n))x=stripH(x.replace(/<(script|style)[\s\S]*?<\/\1>/gi,' '));if(/\.rtf$/i.test(n))x=x.replace(/\\[a-z]+-?\d* ?|[{}]/g,'');return{text:x,name:n}}
const buf=await f.arrayBuffer();
if(ext==='docx')return{text:await docxText(buf),name:n};

if(ext==='pdf'||t==='application/pdf'){let x='';try{x=(await pdfText(buf)).trim()}catch(e){}return x.length>40?{text:x,name:n}:{text:'',b64:b64enc(buf),mime:'application/pdf',name:n}}

const MON=['ocak','şubat','mart','nisan','mayıs','haziran','temmuz','ağustos','eylül','ekim','kasım','aralık'];
function regexDates(txt){const out=[],now=new Date();
txt.split(/\r?\n/).forEach(l=>{let date='',m,rest=l;
if(m=l.match(/(\d{4})-(\d{2})-(\d{2})/)){date=m[0];rest=l.replace(m[0],' ')}
else if(m=l.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{4})/)){date=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;rest=l.replace(m[0],' ')}
else if(m=l.match(new RegExp('(\\d{1,2})\\s+('+MON.join('|')+')\\s*(\\d{4})?','i'))){const mi=MON.indexOf(m[2].toLowerCase()),dd=+m[1];let y=m[3]?+m[3]:now.getFullYear();if(!m[3]&&new Date(y,mi,dd)<new Date(now.getFullYear(),now.getMonth(),now.getDate()))y++;date=`${y}-${String(mi+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;rest=l.replace(m[0],' ')}
if(!date)return;
const tm=rest.match(/(\d{1,2})[:.](\d{2})/),time=tm&&+tm[1]<24&&+tm[2]<60?tm[1].padStart(2,'0')+':'+tm[2]:'';
const title=rest.replace(/(\d{1,2})[:.](\d{2})/,' ').replace(/\bsaat\b/gi,' ').replace(/[,;:|\-–\t]+/g,' ').replace(/\s+/g,' ').trim()||'Etkinlik';out.push({title,date,time})});return out}

const taskCmp=(a,b)=>((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||''));
function addTask(e){if(!e||!e.title)return false;S.tasks.push({id:uid(),title:String(e.title),date:/^\d{4}-\d\d-\d\d$/.test(e.date||'')?e.date:'',time:/^\d\d:\d\d$/.test(e.time||'')?e.time:'',done:false});save();return true}

function voiceTask(){listen(async txt=>{busy('Anlıyorum...');let e;try{e=hasKey()?J(await ai('Türkçe cümleden görev çıkar. Sadece JSON döndür: {"title":"","date":"YYYY-MM-DD veya boş","time":"HH:MM veya boş"}. Bugün: '+today()+' ('+new Date().toLocaleDateString('tr-TR',{weekday:'long'})+').',txt)):localParse(txt)}catch(x){e=localParse(txt)}

function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function tasks(){const t=today(),o=S.tasks.filter(x=>!x.done).sort(taskCmp),d=S.tasks.filter(x=>x.done).slice(-8).reverse();

return `<section class="hero"><h1>Görevler</h1><p class="dim" style="position:relative">${o.length} açık görev</p></section>

${d.length?`<h2>Tamamlananlar</h2><div class="card">${d.map(li).join('')}</div>`:''}`}

/* ---------- Sohbet + hafıza ---------- */
function relevant(q){const w=[...new Set(q.toLowerCase().split(/[^a-zçğıöşü0-9]+/).filter(x=>x.length>=4))];if(!w.length)return '';
const src=[...S.notes.map(n=>({k:'Not: '+n.title,t:n.body})),...S.files.map(f=>({k:'Dosya: '+f.name,t:f.text}))];
return src.map(x=>{const L=x.t.toLowerCase();let sc=0,first=-1;w.forEach(a=>{const i=L.indexOf(a);if(i>=0){sc++;if(first<0||i<first)first=i}});return{...x,sc,first}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,3).map(x=>`[${x.k}] ...${x.t.slice(Math.max(0,x.first-200),x.first+900)}...`).join('\n\n')}
function lifeCtx(q=''){const p=S.profile,t=today(),last=o=>Object.entries(o).sort().slice(-5).map(([d,v])=>d+': '+v).join(', ');
const words=q.toLowerCase().split(/[^a-zçğıöşü0-9]+/).filter(x=>x.length>=4);
let mem=S.memory;if(mem.length>120){const rel=mem.slice(0,-100).filter(m=>words.some(w=>m.t.toLowerCase().includes(w)));mem=[...rel.slice(-40),...mem.slice(-100)]}
const rl=relevant(q);
return `Bugün: ${t} ${new Date().toLocaleDateString('tr-TR',{weekday:'long'})}, saat ${new Date().toTimeString().slice(0,5)}.

const paintChat=()=>{const m=$('#msgs');if(m){m.innerHTML=msgsHtml();scrollTo(0,document.body.scrollHeight)}};
function chat(){return `<div class="nav2"><h2 style="margin:0">Sohbet <small class="dim">· ${esc(PROV[chatProv()].n)}</small></h2><button onclick="go('mem')">Hafıza (${S.memory.length})</button></div><div id="msgs">${msgsHtml()}</div>

async function send(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';if(/teşekkür|sağ ?ol|eyvallah/i.test(t))bump('thanks');S.chat.push({r:'u',t});S.chat=S.chat.slice(-200);S.cnt.msgs=(S.cnt.msgs||0)+1;save();paintChat();busy('Yazıyor...');
try{const hist=S.chat.slice(-21,-1).map(m=>(m.r==='u'?'Ben: ':'Sen: ')+m.t).join('\n');
let out=await ai(CH_SYS(t),(hist?'Önceki konuşma:\n'+hist+'\n\n':'')+'Ben: '+t,chatProv()),mem=[];const k=out.indexOf('###HAFIZA###');
if(k>=0){try{mem=J(out.slice(k+12))}catch(e){}out=out.slice(0,k)}
S.chat.push({r:'a',t:out.trim()});beep('chat');
mem.forEach(m=>{const o=typeof m==='string'?{c:'konu',t:m}:m;if(o&&typeof o.t==='string'&&o.t.trim()&&!S.memory.some(x=>x.t.toLowerCase()===o.t.trim().toLowerCase()))S.memory.push({id:uid(),t:o.t.trim(),c:o.c==='olay'?'olay':o.c==='zevk'?'zevk':'konu',d:/^\d{4}-\d\d-\d\d$/.test(o.d||'')?o.d:'',date:today()})});S.memory=S.memory.slice(-500);save();if(mem.some(m=>m&&m.c==='zevk')&&hasKey()&&Date.now()-(S.recAt||0)>216e5)getRecs()}
catch(e){S.chat.push({r:'a',t:'⚠ '+e.message});save()}busy();if(tab==='chat')paintChat()}
let memTab='all';

const n=c=>S.memory.filter(m=>(m.c||'konu')===c).length;
const fi=m=>`<div class="ev"><span>${esc(m.t)}<br><small class="dim">${({olay:'Olay',zevk:'Zevk'})[m.c||'konu']||'Konu'} · ${m.d||m.date}</small></span><button onclick="delMem('${m.id}')">×</button></div>`;
let body='';
if(memTab==='not')body=S.notes.length?S.notes.map(x=>`<div class="card"><b>${esc(x.title)}</b> <small class="dim">· ${x.date}</small><p class="dim">${esc(x.body.slice(0,140))}${x.body.length>140?'...':''}</p></div>`).join('')+'<div class="row"><button onclick="go(\'notes\')">Notlar sayfasına git</button></div>':'<p class="dim" style="margin:14px 4px">Henüz not yok.</p>';

else{const l=S.memory.filter(m=>memTab==='all'||(m.c||'konu')===memTab).slice().reverse();

<div class="seg" style="margin:10px 0;overflow-x:auto">${tabs.map(([k,l])=>`<button style="flex:none" class="${memTab===k?'on':''}" onclick="memTab='${k}';render()">${l}</button>`).join('')}</div>${body}`}
function addMem(){const t=$('#mi').value.trim();if(!t)return;S.memory.push({id:uid(),t,c:$('#mc').value,d:'',date:today()});save();render()}
function delMem(id){S.memory=S.memory.filter(m=>m.id!==id);save();render()}
function delFile(id){S.files=S.files.filter(f=>f.id!==id);save();render()}

function actDays(){const s=new Set();['steps','sleep','weight'].forEach(k=>Object.keys(S[k]).forEach(d=>s.add(d)));Object.entries(S.done).forEach(([k,v])=>v&&s.add(k.split('|')[0]));S.tasks.forEach(x=>x.doneDate&&s.add(x.doneDate));S.notes.forEach(x=>s.add(x.date));S.games.forEach(x=>s.add(x.date));return s}
function streak(){const s=actDays();let n=0;const d=new Date();if(!s.has(ymd(d)))d.setDate(d.getDate()-1);while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}

else if(p==='github'){const d=await(await fetch('https://models.github.ai/catalog/models',{headers:{authorization:'Bearer '+k}})).json();ids=d.map(m=>m.id)}
else{const d=await(await fetch((S.bases[p]||v.base)+'/models',{headers:{authorization:'Bearer '+k}})).json();ids=(d.data||d||[]).map(m=>m.id||m.name)}
ids=ids.filter(Boolean);if(!ids.length)throw new Error('Liste boş geldi');mlSheet(p,ids)}catch(e){toast('Liste alınamadı: '+e.message)}busy()}
function mlSheet(p,ids){const cur=(S.models[p]||'').split(',').map(x=>x.trim());window._mlp=p;
openM(`<h2 style="margin:0 0 8px">${esc(PROV[p].n)} modelleri</h2><p class="dim">Dokunarak seç, seçtiklerin Konsey'e girer.</p><input placeholder="Ara..." oninput="filtML(this.value)"><div id="mll" style="margin-top:8px">${ids.slice(0,300).map(id=>`<button class="chip ${cur.includes(id)?'on':''}" style="margin:3px" data-m="${esc(id)}" onclick="togModel(this)">${esc(id)}</button>`).join('')}</div><div class="row"><button class="pri" onclick="closeM();render()">Bitti</button></div>`)}
function filtML(v){v=v.toLowerCase();document.querySelectorAll('#mll button').forEach(b=>b.style.display=b.dataset.m.toLowerCase().includes(v)?'':'none')}
function togModel(b){const p=window._mlp,id=b.dataset.m;let a=(S.models[p]||'').split(',').map(x=>x.trim()).filter(Boolean);a=a.includes(id)?a.filter(x=>x!==id):[...a,id];S.models[p]=a.join(', ');b.classList.toggle('on');save()}
function set(){return `<h2>Tema</h2><div class="card"><div class="themes">${THEMES.map(([k,n,a,b])=>`<button class="th ${S.theme===k?'on':''}" onclick="setTheme('${k}')"><i style="background:linear-gradient(135deg,${a},${b})"></i>${n}</button>`).join('')}</div></div>
<h2>Yapay zeka anahtarları</h2><div class="card"><p class="dim">Anahtarlar sadece bu cihazda saklanır. Anahtarını girdiğin her servis Konsey'e otomatik eklenir.</p>${Object.entries(PROV).map(([p,v])=>pv(p,v)).join('')}
<label>Varsayılan sohbet yapay zekası</label><select onchange="S.provider=this.value;save()">${Object.entries(PROV).map(([p,v])=>`<option value="${p}" ${S.provider===p?'selected':''}>${v.n}</option>`).join('')}</select></div>
<h2>Kapak kaynakları</h2><div class="card"><p class="dim">İsteğe bağlı. Anahtar girmezsen ücretsiz kaynaklar (TVMaze, iTunes, Open Library, Google Books, Steam, Wikipedia) denenir. Anahtarını girdiğin kaynaklar önce denenir.</p>

const KN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.KampNative;
async function nativeReq(a){const k=KN();if(!k)return false;try{const r=await k.requestPermissions({permissions:[a]});return r[a]==='granted'}catch(e){return false}}
async function syncSteps(manual){const k=KN();if(!k){if(manual)toast('Adım sayar sadece APK sürümünde çalışır');return}
try{let r;try{r=await k.steps()}catch(e){if(await nativeReq('activity'))r=await k.steps();else throw e}
Object.entries(r.days||{}).forEach(([d,v])=>{if(v>0)S.steps[d]=v});save();if(tab==='home')render();if(manual)toast('Bugünkü adım: '+(S.steps[today()]||0))}
catch(e){if(manual)toast('Adım izni gerekli. Telefon ayarlarından Fiziksel aktivite iznini ver.')}}
function toggleAutoSteps(){S.autoSteps=!S.autoSteps;save();if(S.autoSteps)syncSteps(true);render()}
async function importDeviceCalendar(){const k=KN();if(!k)return toast('Telefon takvimi sadece APK sürümünde çalışır');
try{let r;try{r=await k.calendar({days:60})}catch(e){if(await nativeReq('calendar'))r=await k.calendar({days:60});else throw e}
let n=0;(r.events||[]).forEach(e=>{const d=new Date(e.begin);if(addEv({title:e.title||'Etkinlik',date:e.allDay?d.toISOString().slice(0,10):ymd(d),time:e.allDay?'':d.toTimeString().slice(0,5)}))n++});
render();n?ach(n+' etkinlik telefon takviminden alındı'):toast('Yeni etkinlik bulunamadı')}catch(e){toast('Takvim izni gerekli')}}
function photoFromUrl(u){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=192;const m=Math.min(img.width,img.height);
c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,192,192);S.photo=c.toDataURL('image/jpeg',.85);save();render();ach('Profil fotoğrafı güncellendi')};img.onerror=()=>toast('Fotoğraf açılamadı');img.src=u}
async function cameraPhoto(){const C=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Camera;if(!C)return toast('Kamera sadece APK sürümünde çalışır');
try{const p=await C.getPhoto({quality:80,width:400,allowEditing:false,resultType:'dataUrl',source:'CAMERA'});photoFromUrl(p.dataUrl)}catch(e){toast('Kamera kapatıldı')}}

return out}
async function fetchNews(force){if(window._nl)return;const n=S.news;if(!force&&n&&Date.now()-n.at<36e5)return;window._nl=1;
try{const res=await Promise.allSettled(feeds().map(async([name,url])=>{const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return parseFeed(await r.text(),name)}finally{clearTimeout(to)}}));
let items=res.flatMap(r=>r.status==='fulfilled'?r.value:[]);const seen=new Set();items=items.filter(i=>{const k=i.t.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>b.d-a.d).slice(0,40);
if(items.length){S.news={at:Date.now(),items,ok:res.filter(r=>r.status==='fulfilled').length,all:res.length};save()}else if(force)toast('Haberler alınamadı. İnternet bağlantını ya da kaynak adreslerini kontrol et.');
if(tab==='home'||tab==='news')render()}finally{window._nl=0}}
function newsOpen(i){const it=(S.news&&S.news.items||[])[i];if(!it)return;bump('newsOpen');window.open(it.l,'_blank')}
async function newsTr(){const n=S.news;if(!n)return;if(!hasKey())return toast('Çeviri için bir yapay zeka anahtarı gerekli');busy('Başlıklar çevriliyor...');
try{const sub=n.items.slice(0,20),o=J(await ai('Oyun haberi başlıklarını doğal Türkçeye çevir. Sadece JSON dizisi döndür, aynı sırada ve aynı sayıda.',JSON.stringify(sub.map(x=>x.t))));o.forEach((t,i)=>{if(sub[i]&&typeof t==='string')sub[i].tr=t});save();render()}catch(e){toast(e.message)}busy()}
const ago=ms=>{if(!ms)return '';const m=Math.round((Date.now()-ms)/6e4);return m<60?Math.max(m,1)+' dk önce':m<1440?Math.round(m/60)+' sa önce':Math.round(m/1440)+' gün önce'};
function newsSec(){const n=S.news,it=n?n.items.slice(0,3):[];
return `<h2>Oyun dünyası</h2><div class="card">${it.length?it.map((x,i)=>`<div class="nw" onclick="newsOpen(${i})"><small class="dim">${esc(x.src)} · ${ago(x.d)}</small><b>${esc(x.tr||x.t)}</b></div>`).join(''):`<p class="dim">${window._nl?'Haberler yükleniyor...':'Haberler henüz yüklenmedi.'}</p>`}<div class="row"><button class="moss" onclick="go('news')">Tüm haberler</button></div></div>`}
function newsPage(){setTimeout(()=>fetchNews(),0);const n=S.news,it=n?n.items:[];
return `<section class="hero"><h1>Oyun Haberleri</h1><p class="dim" style="position:relative">${n?n.ok+'/'+n.all+' kaynak · '+ago(n.at)+' güncellendi':'Yükleniyor...'}</p></section>
<div class="row"><button class="moss" onclick="fetchNews(true)">Yenile</button><button onclick="newsTr()">Başlıkları Türkçeye çevir</button></div>
${it.length?it.map((x,i)=>`<div class="card nw" onclick="newsOpen(${i})">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}<small class="dim">${esc(x.src)} · ${ago(x.d)}</small><b>${esc(x.tr||x.t)}</b>${x.s?`<p class="dim" style="margin:4px 0 0;font-size:13px">${esc(x.s)}</p>`:''}</div>`).join(''):'<p class="dim" style="margin:14px 4px">Henüz haber yok. İnternet bağlantısı gerekir.</p>'}`}
setTimeout(()=>{if(S.profile)fetchNews()},2500);

/* ---------- Başlat ---------- */
function render(){const a=$('#app');
if(!S.profile||editing){a.innerHTML=onboard();$('nav').style.display='none';return}
a.innerHTML={home,cal,tasks,chat,more,notes,council,sum:summary,notif,set,mem:memPage,ach:badgesPage,news:newsPage,plan:planPage,nset:nsetPage}[tab]();$('nav').style.display='flex';
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===(['notes','council','sum','notif','set','mem','ach','news','plan','nset'].includes(tab)?'more':tab)));if(tab==='chat')setTimeout(()=>scrollTo(0,document.body.scrollHeight),0);if(tab==='home')setTimeout(ensureCovers,300)}
document.documentElement.dataset.theme=S.theme;render();setInterval(tickEv,20000);tickEv();document.addEventListener('visibilitychange',tickEv);getWx();getGameFact();setTimeout(()=>{if(S.updUrl&&Date.now()-(S.updAt||0)>2*36e5){S.updAt=Date.now();checkUpdate()}},3000);
if(S.profile&&hasKey()&&!(S.recs[today()]&&S.recs[today()].series))getRecs();
if(S.profile&&hasKey()&&!(S.quote&&S.quote.date===today()))getQuote();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkShared();if(S.autoSteps)syncSteps()}});checkShared();if(S.autoSteps)syncSteps();
(function(){const hk=(n,k,c)=>{const f=window[n];if(typeof f!=='function')return;window[n]=function(){if(!c||c(arguments))bump(k);return f.apply(this,arguments)}};
hk('listen','voice');hk('getRecs','recref');hk('getQuote','quote',a=>a[0]===true);hk('checkUpdate','upd',a=>a[0]===true);hk('pickLoc','loc');hk('myLoc','loc');hk('delTask','del');hk('delEv','del');
hk('importDeviceCalendar','calDev');hk('cameraPhoto','cam');hk('shareTo','share');hk('getHltb','hltb');hk('ping','pings');
const sg=window.go;window.go=function(t){S.cnt['pg_'+t]=1;if(t==='sum')S.cnt.sum=(S.cnt.sum||0)+1;save();return sg.apply(this,arguments)};
const st=window.setTheme;window.setTheme=function(k){mark('themes',k);return st.apply(this,arguments)};
const si=window.setAppIcon;window.setAppIcon=function(n){mark('icons',n);return si.apply(this,arguments)};
if(S.profile){const h=new Date().getHours();S.cnt.opens=(S.cnt.opens||0)+1;S.cnt.days=S.cnt.days||{};S.cnt.days[today()]=1;if(h<5)S.cnt.night=(S.cnt.night||0)+1;if(h>=5&&h<7)S.cnt.early=(S.cnt.early||0)+1;save()}})();
try{localStorage.setItem('kd_boot','ok')}catch(e){}

</script>
